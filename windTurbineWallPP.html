<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wall-Pressure Spectrum — Equation (5)</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #555;
    font-size: 14px;
    margin-bottom: 25px;
}

#chartContainer {
    height: 420px;
}

.slider-group {
    margin-top: 18px;
    padding: 12px;
    background: #fafafa;
    border-radius: 5px;
}

.slider-label {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
}

.slider-value {
    font-weight: bold;
    color: #0055aa;
}

input[type="range"] {
    width: 100%;
}

#downloadBtn {
    margin-top: 25px;
    padding: 12px 18px;
    font-size: 14px;
    background: #0055aa;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

#downloadBtn:hover {
    background: #003f80;
}
</style>
</head>

<body>
<div class="container">

<h1>Wall-Pressure Spectrum</h1>
<div class="subtitle">
Based on Equation (5) — Reynolds Number Dependence
</div>

<div id="chartContainer">
<canvas id="spectrumChart"></canvas>
</div>

<!-- Slider for RT -->
<div class="slider-group">
    <div class="slider-label">
        <span>Reynolds number <i>R<sub>T</sub></i></span>
        <span class="slider-value" id="valRT">100</span>
    </div>
    <input type="range" id="sliderRT" min="10" max="2000" step="10" value="100">
</div>

<button id="downloadBtn">⬇ Download Φ<sub>pp</sub>(ω)</button>

</div>

<script>
/* ------------------------------------------------------
   FIXED MODEL PARAMETERS
------------------------------------------------------ */
const tau_w = 1.0;      // Wall shear stress (normalized)
const delta = 1.0;      // Boundary layer thickness (normalized)
const U_e = 1.0;        // Edge velocity (normalized)

/* ------------------------------------------------------
   Non-dimensional frequency array: ωδ/U_e from 10^-3 to 10^4
------------------------------------------------------ */
function logspace(start, stop, n) {
    const ls = Math.log10(start);
    const le = Math.log10(stop);
    return Array.from({length: n}, (_, i) =>
        Math.pow(10, ls + (le - ls) * i / (n - 1))
    );
}

const omega_delta_Ue = logspace(1e-3, 1e4, 1000);

/* ------------------------------------------------------
   Wall-pressure spectrum using Equation (5)
   
   Φ(ω)U_e / (τ_w² δ) = 3.0(ωδ/U_e)² / 
                        { [(ωδ/U_e)^0.75 + 0.5]^3.7 + [(1.1R_T^-0.57)(ωδ/U_e)]^7 }
------------------------------------------------------ */
function wallPressureSpectrum(omega_delta_Ue, RT) {
    
    const omega_norm = omega_delta_Ue;  // ωδ/U_e
    
    const numerator = 3.0 * Math.pow(omega_norm, 2);
    
    const term1 = Math.pow(Math.pow(omega_norm, 0.75) + 0.5, 3.7);
    
    const term2 = Math.pow((1.1 * Math.pow(RT, -0.57)) * omega_norm, 7);
    
    const denominator = term1 + term2;
    
    return numerator / denominator;
}

function computeSpectrum(RT) {
    return omega_delta_Ue.map(w => {
        const phiValue = wallPressureSpectrum(w, RT);
        return 10 * Math.log10(phiValue);  // Return 10*log10 for proper dB scale
    });
}

/* ------------------------------------------------------
   Chart.js
------------------------------------------------------ */
const ctx = document.getElementById('spectrumChart').getContext('2d');

const spectrumChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: omega_delta_Ue,
        datasets: [{
            data: computeSpectrum(100),
            borderColor: '#0055aa',
            borderWidth: 2,
            pointRadius: 0
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            x: { 
                type: 'logarithmic', 
                min: 1e-3,
                max: 1e4,
                title: { display: true, text: 'ωδ/Uₑ' }
            },
            y: { 
                type: 'linear',
                min: -40,
                max: 5,
                title: { display: true, text: '10 Log₁₀ [Φ(ω)Uₑ / τ_w²δ]' }
            }
        },
        plugins: { 
            legend: { display: false },
            tooltip: {
                callbacks: {
                    label: function(context) {
                        const log10Val = context.parsed.y;
                        return `10 Log₁₀(Φ) = ${log10Val.toFixed(2)}`;
                    }
                }
            }
        }
    }
});

/* ------------------------------------------------------
   Slider update
------------------------------------------------------ */
function updatePlot() {
    const RT = +sliderRT.value;

    valRT.textContent = RT.toFixed(0);

    spectrumChart.data.datasets[0].data = computeSpectrum(RT);

    spectrumChart.update('none');
}

sliderRT.oninput = updatePlot;

/* ------------------------------------------------------
   Download Φpp
------------------------------------------------------ */
downloadBtn.onclick = () => {

    const RT = +sliderRT.value;

    let csv = "omega_delta_Ue,Phi_pp_normalized,10Log10_Phi_pp\n";

    for (let i = 0; i < omega_delta_Ue.length; i++) {
        const phiValue = wallPressureSpectrum(omega_delta_Ue[i], RT);
        const log10Value = 10 * Math.log10(phiValue);
        csv += `${omega_delta_Ue[i]},${phiValue},${log10Value}\n`;
    }

    const blob = new Blob([csv], { type: "text/csv" });
    const url  = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "Phi_pp_spectrum.csv";
    a.click();

    URL.revokeObjectURL(url);
};
</script>

</body>
</html>
